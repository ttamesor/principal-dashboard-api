<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Principal Climate - Operations Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #080d17;
  --bg2:     #0d1424;
  --bg3:     #131c30;
  --bg4:     #1a253d;
  --border:  rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.11);
  --text:    #dde4f0;
  --dim:     #6b7a96;
  --muted:   #3a4560;
  --blue:    #3b82f6;
  --cyan:    #06b6d4;
  --green:   #10b981;
  --amber:   #f59e0b;
  --red:     #ef4444;
  --purple:  #8b5cf6;
  --orange:  #f97316;
  --mono:    'DM Mono', monospace;
  --sans:    'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 15px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 0% 0%, rgba(59,130,246,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 100% 100%, rgba(16,185,129,0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

.layout {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 220px 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
}
.sidebar::-webkit-scrollbar { width: 3px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

.brand {
  padding: 22px 18px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.brand-icon {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--blue), var(--cyan));
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; flex-shrink: 0;
}
.brand-name { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2; }
.brand-sub { font-size: 0.65rem; font-family: var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

.nav-area { padding: 12px 10px; flex: 1; }

.nav-section-label {
  font-size: 0.72rem; font-family: var(--sans); font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px; color: var(--text);
  padding: 14px 8px 5px; border-top: 1px solid var(--border); margin-top: 4px;
}
.nav-section-label:first-child { border-top: none; margin-top: 0; padding-top: 6px; }

.nav-btn {
  width: 100%; display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: 7px; border: none; background: transparent;
  color: #8a9ab8; cursor: pointer; font-family: var(--sans); font-size: 0.86rem;
  font-weight: 500; transition: all 0.12s; text-align: left; position: relative;
}
.nav-btn:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.nav-btn.active { background: rgba(59,130,246,0.12); color: var(--blue); }
.nav-btn.active::before {
  content: ''; position: absolute; left: 0; top: 20%; bottom: 20%;
  width: 3px; background: var(--blue); border-radius: 0 2px 2px 0;
}
.nav-icon { font-size: 0.9rem; width: 18px; text-align: center; flex-shrink: 0; }
.nav-btn.danger.active { background: rgba(239,68,68,0.12); color: var(--red); }
.nav-btn.danger.active::before { background: var(--red); }
.nav-btn.amber.active { background: rgba(245,158,11,0.12); color: var(--amber); }
.nav-btn.amber.active::before { background: var(--amber); }
.nav-btn.green.active { background: rgba(16,185,129,0.12); color: var(--green); }
.nav-btn.green.active::before { background: var(--green); }

.sidebar-footer {
  padding: 14px 18px; border-top: 1px solid var(--border);
  font-size: 0.7rem; font-family: var(--mono); color: var(--muted); flex-shrink: 0;
}

/* ── MAIN ── */
.main { display: flex; flex-direction: column; height: 100vh; overflow: hidden; min-width: 0; }

/* ── TOPBAR ── */
.topbar {
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: var(--bg2);
}
.page-title {
  font-size: 0.9rem; font-weight: 700; color: var(--dim);
  text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
}

/* Three search boxes */
.search-trio { display: flex; gap: 8px; margin-left: auto; }
.search-wrap-sm { position: relative; width: 170px; }
.search-icon-sm {
  position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  font-size: 0.75rem; pointer-events: none;
}
.search-input-sm {
  width: 100%; padding: 7px 26px 7px 30px; background: var(--bg3);
  border: 1px solid var(--border2); border-radius: 8px; color: var(--text);
  font-family: var(--mono); font-size: 0.75rem; outline: none; transition: border-color 0.2s;
}
.search-input-sm::placeholder { color: var(--muted); }
.search-input-sm:focus { border-color: var(--blue); }
.search-clear-sm {
  position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 0.8rem; display: none; padding: 0; line-height: 1;
}
.search-clear-sm.visible { display: block; }

.refresh-btn {
  background: var(--bg3); border: 1px solid var(--border2); border-radius: 7px;
  color: var(--dim); font-family: var(--sans); font-size: 0.75rem;
  padding: 7px 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.refresh-btn:hover { background: var(--bg4); color: var(--text); }

/* ── STATS BAR ── */
.stats-bar {
  display: grid; grid-template-columns: repeat(6, 1fr);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.stat-cell {
  padding: 14px 16px; border-right: 1px solid var(--border);
  position: relative; overflow: hidden; cursor: pointer; transition: background 0.15s;
}
.stat-cell:last-child { border-right: none; }
.stat-cell:hover { background: rgba(255,255,255,0.02); }
.stat-cell::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; }
.stat-cell.c-blue::after  { background: linear-gradient(90deg, var(--blue), transparent); }
.stat-cell.c-green::after { background: linear-gradient(90deg, var(--green), transparent); }
.stat-cell.c-amber::after { background: linear-gradient(90deg, var(--amber), transparent); }
.stat-cell.c-red::after   { background: linear-gradient(90deg, var(--red), transparent); }
.stat-cell.c-cyan::after  { background: linear-gradient(90deg, var(--cyan), transparent); }
.stat-cell.c-purple::after{ background: linear-gradient(90deg, var(--purple), transparent); }
.stat-label {
  font-size: 0.68rem; font-family: var(--mono); text-transform: uppercase;
  letter-spacing: 1px; color: var(--dim); margin-bottom: 7px; font-weight: 600;
}
.stat-val {
  font-family: var(--mono); font-size: 1.45rem; font-weight: 700;
  letter-spacing: -0.5px; line-height: 1; color: #ffffff;
}
.stat-val.loading::after {
  content: ''; display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.15); border-top-color: currentColor;
  border-radius: 50%; animation: spin 0.7s linear infinite;
  vertical-align: middle; margin-left: 4px;
}
.stat-cell.c-blue .stat-val  { color: var(--blue); }
.stat-cell.c-green .stat-val { color: var(--green); }
.stat-cell.c-amber .stat-val { color: var(--amber); }
.stat-cell.c-red .stat-val   { color: var(--red); }
.stat-cell.c-cyan .stat-val  { color: var(--cyan); }
.stat-cell.c-purple .stat-val{ color: var(--purple); }
.stat-sub { font-size: 0.7rem; color: var(--dim); margin-top: 4px; }

/* ── CONTENT ── */
.content-area { flex: 1; overflow-y: auto; min-height: 0; padding: 20px 24px; }
.content-area::-webkit-scrollbar { width: 4px; }
.content-area::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

/* ── CALENDAR ── */
.cal-nav {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
}
.cal-month-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.3px; flex: 1; }
.cal-nav-btn {
  background: var(--bg3); border: 1px solid var(--border2); border-radius: 7px;
  color: var(--dim); font-size: 0.9rem; width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s;
}
.cal-nav-btn:hover { background: var(--bg4); color: var(--text); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-day-header {
  text-align: center; font-size: 0.62rem; font-family: var(--mono);
  text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 6px 0;
}
.cal-day {
  min-height: 72px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px; transition: background 0.12s; cursor: default; position: relative;
}
.cal-day.has-items { cursor: pointer; }
.cal-day.has-items:hover { background: var(--bg3); border-color: var(--border2); }
.cal-day.today { border-color: var(--blue); background: rgba(59,130,246,0.06); }
.cal-day.other-month { opacity: 0.3; }
.cal-day-num { font-size: 0.72rem; font-family: var(--mono); color: var(--dim); margin-bottom: 4px; }
.cal-day.today .cal-day-num { color: var(--blue); font-weight: 600; }
.cal-dots { display: flex; flex-wrap: wrap; gap: 2px; }
.cal-dot { width: 8px; height: 8px; border-radius: 2px; font-size: 0; flex-shrink: 0; }
.cal-dot.shipped   { background: var(--green); }
.cal-dot.unshipped { background: var(--amber); }
.cal-dot.overdue   { background: var(--red); }
.cal-count { position: absolute; bottom: 5px; right: 6px; font-size: 0.6rem; font-family: var(--mono); color: var(--muted); }

/* ── WEEK VIEW ── */
.week-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 6px; height: calc(100vh - 220px);
}
.week-col {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; min-height: 0;
}
.week-col.week-today { border-color: var(--blue); background: rgba(59,130,246,0.05); }
.week-day-header {
  padding: 8px 10px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
.week-day-name { font-size: 0.65rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.week-day-num { font-family: var(--mono); font-size: 0.85rem; font-weight: 600; color: var(--dim); }
.week-today-num {
  color: var(--blue); background: rgba(59,130,246,0.15); border-radius: 50%;
  width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 0.78rem;
}
.week-day-count {
  margin-left: auto; font-family: var(--mono); font-size: 0.65rem; color: var(--muted);
  background: var(--bg4); border-radius: 8px; padding: 1px 6px;
}
.week-col.week-today .week-day-count { background: rgba(59,130,246,0.2); color: var(--blue); }
.week-day-body { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
.week-day-body::-webkit-scrollbar { width: 3px; }
.week-day-body::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }
.week-item {
  background: var(--bg3); border-radius: 6px; padding: 7px 9px; cursor: pointer;
  transition: background 0.1s; border-left: 3px solid var(--border2);
}
.week-item:hover { background: var(--bg4); }
.week-item-desc { font-size: 0.75rem; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 2px; }
.week-item-sub { font-size: 0.65rem; font-family: var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.week-item-serial { font-size: 0.65rem; font-family: var(--mono); color: var(--cyan); margin-top: 2px; }
.week-empty { font-size: 0.7rem; color: var(--muted); text-align: center; padding: 16px 8px; font-family: var(--mono); }

/* ── SECTION HEADER ── */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
}
.section-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--dim); }
.section-count { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }

/* ── ITEM TABLE ── */
.item-table { width: 100%; border-collapse: collapse; }
.item-table th {
  text-align: left; font-size: 0.6rem; font-family: var(--mono); text-transform: uppercase;
  letter-spacing: 1px; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--border); font-weight: 500;
}
.item-table td { padding: 9px 10px; font-size: 0.8rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
.item-table tr { transition: background 0.1s; cursor: pointer; }
.item-table tr:hover td { background: rgba(255,255,255,0.025); }
.item-table tr:last-child td { border-bottom: none; }
.td-docno { font-family: var(--mono); font-size: 0.72rem; color: var(--blue); font-weight: 500; white-space: nowrap; }
.td-desc { max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); font-weight: 600; }
.td-company { color: var(--dim); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.td-serial { font-family: var(--mono); font-size: 0.72rem; color: var(--cyan); }
.td-date { font-family: var(--mono); font-size: 0.72rem; white-space: nowrap; font-weight: 600; color: #ffffff; }
.td-days { font-family: var(--mono); font-size: 0.72rem; white-space: nowrap; font-weight: 600; }
.days-ok      { color: var(--green); }
.days-soon    { color: var(--amber); }
.days-overdue { color: var(--red); }
.days-past    { color: var(--muted); }

/* Load more */
.load-more-wrap { text-align: center; padding: 20px 0 8px; }
.load-more-btn {
  background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px;
  color: var(--dim); font-family: var(--sans); font-size: 0.8rem; font-weight: 500;
  padding: 9px 24px; cursor: pointer; transition: all 0.15s;
}
.load-more-btn:hover { background: var(--bg4); color: var(--text); }

/* Pills */
.pill {
  display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px;
  border-radius: 20px; font-size: 0.75rem; font-family: var(--mono); font-weight: 600; white-space: nowrap;
}
.pill-shipped   { background: rgba(16,185,129,0.12); color: var(--green);  border: 1px solid rgba(16,185,129,0.2); }
.pill-unshipped { background: rgba(245,158,11,0.12); color: var(--amber);  border: 1px solid rgba(245,158,11,0.2); }
.pill-overdue   { background: rgba(239,68,68,0.12);  color: var(--red);    border: 1px solid rgba(239,68,68,0.2); }
.pill-order     { background: rgba(59,130,246,0.12); color: var(--blue);   border: 1px solid rgba(59,130,246,0.2); }
.pill-quote     { background: rgba(139,92,246,0.12); color: var(--purple); border: 1px solid rgba(139,92,246,0.2); }

/* Search notice */
.search-bar-notice {
  padding: 10px 14px; background: rgba(6,182,212,0.08); border: 1px solid rgba(6,182,212,0.2);
  border-radius: 8px; font-size: 0.78rem; color: var(--cyan); margin-bottom: 14px; font-family: var(--mono);
}

/* Empty / Loader */
.empty { padding: 60px 20px; text-align: center; color: var(--muted); }
.empty-icon { font-size: 2rem; margin-bottom: 10px; opacity: 0.4; }
.empty-text { font-size: 0.82rem; }
.loader { display: flex; align-items: center; justify-content: center; padding: 60px; }
.spinner {
  width: 24px; height: 24px; border: 2px solid var(--border2);
  border-top-color: var(--blue); border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── DETAIL PANEL ── */
.panel-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  z-index: 200; opacity: 0; visibility: hidden; transition: all 0.2s;
}
.panel-overlay.open { opacity: 1; visibility: visible; }
.detail-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 480px;
  background: var(--bg2); border-left: 1px solid var(--border2); z-index: 201;
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); overflow: hidden;
}
.panel-overlay.open .detail-panel { transform: translateX(0); }
.panel-head {
  padding: 18px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-shrink: 0;
}
.panel-docno { font-family: var(--mono); font-size: 0.72rem; color: var(--blue); margin-bottom: 3px; }
.panel-desc { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.3px; line-height: 1.3; color: #ffffff; }
.panel-company { font-size: 0.78rem; color: var(--dim); margin-top: 3px; }
.panel-close {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 7px;
  color: var(--dim); width: 30px; height: 30px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; font-size: 1rem; flex-shrink: 0; transition: all 0.15s;
}
.panel-close:hover { background: var(--bg4); color: var(--text); }
.panel-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
.panel-body::-webkit-scrollbar { width: 3px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--bg4); }

/* Serial hero */
.serial-hero {
  background: linear-gradient(135deg, rgba(6,182,212,0.12), rgba(59,130,246,0.08));
  border: 1px solid rgba(6,182,212,0.25); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
}
.serial-label { font-size: 0.6rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 1.5px; color: var(--cyan); margin-bottom: 5px; }
.serial-value { font-family: var(--mono); font-size: 1.1rem; font-weight: 500; color: var(--text); letter-spacing: 1px; }
.serial-empty { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); font-style: italic; }

/* Internal notes box */
.notes-box {
  background: rgba(245,158,11,0.07); border: 1px solid rgba(245,158,11,0.2);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
}
.notes-box-label { font-size: 0.6rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 1.5px; color: var(--amber); margin-bottom: 6px; }
.notes-box-text { font-size: 0.82rem; color: var(--text); line-height: 1.6; white-space: pre-wrap; }

/* Detail grid */
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.detail-cell { background: var(--bg3); border-radius: 8px; padding: 10px 12px; }
.detail-cell.full { grid-column: 1 / -1; }
.dc-label { font-size: 0.65rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin-bottom: 4px; }
.dc-val { font-size: 0.88rem; font-weight: 600; color: #ffffff; line-height: 1.4; }
.dc-val.green  { color: var(--green); font-family: var(--mono); }
.dc-val.amber  { color: var(--amber); font-family: var(--mono); }
.dc-val.red    { color: var(--red);   font-family: var(--mono); }
.dc-val.blue   { color: var(--blue);  font-family: var(--mono); }
.dc-val.cyan   { color: var(--cyan);  font-family: var(--mono); }
.dc-val.mono   { font-family: var(--mono); font-size: 0.78rem; }
.panel-section-title {
  font-size: 0.6rem; font-family: var(--mono); text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--muted); margin: 14px 0 8px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
}

/* ── DAY MODAL ── */
.day-modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
  z-index: 300; display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: all 0.2s;
}
.day-modal-overlay.open { opacity: 1; visibility: visible; }
.day-modal {
  background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px;
  width: 90%; max-width: 560px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(8px) scale(0.98); transition: transform 0.2s;
}
.day-modal-overlay.open .day-modal { transform: translateY(0) scale(1); }
.day-modal-head {
  padding: 16px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.day-modal-title { font-size: 0.9rem; font-weight: 700; }
.day-modal-close {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
  color: var(--dim); width: 28px; height: 28px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; font-size: 0.9rem; transition: all 0.15s;
}
.day-modal-close:hover { background: var(--bg4); color: var(--text); }
.day-modal-body { overflow-y: auto; flex: 1; }
.day-modal-body::-webkit-scrollbar { width: 3px; }
.day-modal-body::-webkit-scrollbar-thumb { background: var(--bg4); }
.day-item-row {
  display: grid; grid-template-columns: 1fr auto; padding: 11px 18px;
  border-bottom: 1px solid var(--border); cursor: pointer; gap: 12px;
  align-items: center; transition: background 0.1s;
}
.day-item-row:hover { background: rgba(255,255,255,0.025); }
.day-item-row:last-child { border-bottom: none; }
.di-desc { font-size: 0.82rem; font-weight: 600; color: #ffffff; margin-bottom: 2px; }
.di-sub  { font-size: 0.72rem; color: var(--dim); }
.di-serial { font-family: var(--mono); font-size: 0.68rem; color: var(--cyan); margin-top: 2px; }

/* ── DOC TABLE ── */
.doc-table { width: 100%; border-collapse: collapse; }
.doc-table th {
  text-align: left; font-size: 0.6rem; font-family: var(--mono); text-transform: uppercase;
  letter-spacing: 1px; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--border); font-weight: 500;
}
.doc-table td { padding: 9px 10px; font-size: 0.8rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
.doc-table tr { transition: background 0.1s; cursor: pointer; }
.doc-table tr:hover td { background: rgba(255,255,255,0.025); }
.doc-table tr:last-child td { border-bottom: none; }
.progress-bar { height: 4px; background: var(--bg4); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); border-radius: 2px; transition: width 0.5s ease; }

/* ── MOBILE ── */
@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .stats-bar { grid-template-columns: repeat(3, 1fr); }
  .topbar { padding: 10px 14px; gap: 8px; }
  .search-trio { gap: 5px; }
  .search-wrap-sm { width: 100px; }
  .content-area { padding: 14px; }
  .detail-panel { width: 100%; }
  .week-grid { grid-template-columns: repeat(3, 1fr); height: auto; }
}
@media (max-width: 900px) and (min-width: 769px) {
  .layout { grid-template-columns: 180px 1fr; }
  .stats-bar { grid-template-columns: repeat(3, 1fr); }
  .search-wrap-sm { width: 130px; }
}
</style>
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->

  <!-- MAIN -->

<!-- DETAIL PANEL -->

<script>
const API = '/api/data';

// ── Field label map from QW customisations ──────────────────────────────────
const ITEM_LABELS = {
  Description:            'Description',
  ManufacturerPartNumber: 'Manufacturer Part #',
  QtyTotal:               'Qty',
  UnitCost:               'Buy Price',
  UnitPrice:              'Nett Price',
  ExtendedPrice:          'Total Price',
  CustomText02:           'Status',
  CustomDate01:           'Delivery Date',
  CustomText04:           'Serial Number',
  CustomText03:           'Daikin Invoice No',
  CustomText10:           'Xero Invoice Number',
  CustomMemo01:           'Further Detail',
  Notes:                  'Include in Tech Schedule',
  Vendor:                 'Supplier',
};
const HEADER_LABELS = {
  CustomText05: 'Xero Invoice #',
};

// ── State ───────────────────────────────────────────────────────────────────
let currentTab   = 'calendar';
let calYear      = new Date().getFullYear();
let calMonth     = new Date().getMonth() + 1;
let calData      = [];
let calView      = 'week';
let searchTimeout = null;
const calCache   = {};
let calWeekStart = getWeekStart(new Date()).getDate();

// Pagination state per tab
const pageState = {};

// ── Helpers ─────────────────────────────────────────────────────────────────
function fmt(v)     { return parseFloat(v||0).toLocaleString('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}); }
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function fmtShort(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}
function daysClass(n) {
  if (n===null||n===undefined) return '';
  if (n<0) return 'days-overdue';
  if (n<=7) return 'days-soon';
  return 'days-ok';
}
function daysLabel(n) {
  if (n===null||n===undefined) return '—';
  if (n===0) return 'Today';
  if (n===1) return 'Tomorrow';
  if (n<0)   return Math.abs(n)+'d overdue';
  return n+'d';
}
function shippedPill(s) {
  if (!s) return '<span class="pill pill-unshipped">Unshipped</span>';
  if (s.toLowerCase().includes('shipped')) return '<span class="pill pill-shipped">✓ '+s+'</span>';
  return '<span class="pill pill-unshipped">'+(s||'Unshipped')+'</span>';
}
function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  d.setDate(d.getDate() - (day===0?6:day-1));
  return d;
}

// ── API ──────────────────────────────────────────────────────────────────────
async function apiFetch(params) {
  const url = API+'?'+new URLSearchParams(params).toString();
  const res  = await fetch(url);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── Stats ────────────────────────────────────────────────────────────────────
async function loadStats() {
  try {
    const data = await apiFetch({mode:'stats'});
    const get  = (type,status) => (data.find(r=>r.DocType===type&&r.DocStatus===status)||{}).DocCount||0;
    const newOrders  = get('ORDER','New Order');
    const completed  = get('ORDER','Completed Order');
    const openQuotes = get('QUOTE','Open');

    document.getElementById('stat-new-orders').textContent  = newOrders;
    document.getElementById('stat-completed').textContent   = completed;
    document.getElementById('stat-open-quotes').textContent = openQuotes;

    // Mark delivery stats as loading with spinner
    ['stat-upcoming','stat-overdue','stat-unshipped'].forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.textContent = ''; el.classList.add('loading'); }
    });

    loadDeliveryStats();
  } catch(e) { console.error('Stats error:',e); }
}

function updateStatBadge(id, count) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('loading');
  el.textContent = count;
}

async function loadDeliveryStats() {
  const delay = ms => new Promise(r=>setTimeout(r,ms));
  const fetchStat = async (mode, statId, delayMs) => {
    await delay(delayMs);
    try {
      const data = await apiFetch({mode});
      updateStatBadge(statId, data.length);
    } catch(_) {}
  };
  fetchStat('upcoming',  'stat-upcoming',  2000);
  fetchStat('overdue',   'stat-overdue',   4000);
  fetchStat('unshipped', 'stat-unshipped', 6000);
  document.getElementById('lastUpdated').textContent =
    'Updated '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

// ── Auto-refresh every 5 minutes ─────────────────────────────────────────────
setInterval(() => {
  loadStats();
  // Bust cache for current month so it refreshes
  const key = calYear+'-'+calMonth;
  delete calCache[key];
  if (currentTab === 'calendar') loadCalendar();
}, 5 * 60 * 1000);

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(btn, tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const titles = {
    calendar:'Delivery Calendar', upcoming:'Upcoming Deliveries', overdue:'Overdue — Not Shipped',
    unshipped:'Unshipped Items', shipped:'Shipped Items',
    'new-orders':'New Orders', 'completed-orders':'Completed Orders',
    'open-quotes':'Open Quotes', 'won-quotes':'Won Quotes', search:'Search Results'
  };
  document.getElementById('pageTitle').textContent = titles[tab]||tab;
  clearAllSearches();
  loadTab(tab);
}

async function loadTab(tab) {
  const area = document.getElementById('contentArea');
  area.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
  try {
    if (tab==='calendar') {
      await loadCalendar();
    } else if (tab==='upcoming') {
      const data = await apiFetch({mode:'upcoming'});
      updateStatBadge('stat-upcoming', data.length);
      renderItemTable(data,'Upcoming Deliveries — next 90 days');
    } else if (tab==='overdue') {
      const data = await apiFetch({mode:'overdue'});
      updateStatBadge('stat-overdue', data.length);
      renderItemTable(data,'Overdue — past delivery date, not shipped');
    } else if (tab==='unshipped') {
      const data = await apiFetch({mode:'unshipped'});
      updateStatBadge('stat-unshipped', data.length);
      renderItemTable(data,'Unshipped items with delivery dates');
    } else if (tab==='shipped') {
      renderItemTable(await apiFetch({mode:'shipped'}),'Shipped items');
    } else if (tab==='new-orders') {
      renderDocTable(await apiFetch({mode:'list',docType:'ORDER',status:'New Order',page:1}),'New Orders');
    } else if (tab==='completed-orders') {
      renderDocTable(await apiFetch({mode:'list',docType:'ORDER',status:'Completed Order',page:1}),'Completed Orders');
    } else if (tab==='open-quotes') {
      renderDocTable(await apiFetch({mode:'list',docType:'QUOTE',status:'Open',page:1}),'Open Quotes');
    } else if (tab==='won-quotes') {
      renderDocTable(await apiFetch({mode:'list',docType:'QUOTE',status:'Won',page:1}),'Won Quotes');
    }
  } catch(e) {
    area.innerHTML = `<div class="empty"><div class="empty-icon">⚠</div><div class="empty-text">Error: ${e.message}</div></div>`;
  }
}

function refreshCurrent() { loadTab(currentTab); loadStats(); }

// ── Calendar ──────────────────────────────────────────────────────────────────
async function loadCalendar() {
  const key = calYear+'-'+calMonth;
  if (!calCache[key]) {
    calCache[key] = await apiFetch({mode:'calendar',month:calMonth,year:calYear});
  }
  calData = calCache[key];
  if (calView==='week') renderWeekView();
  else renderCalendar();
  scheduleIdlePrefetch();
}

function adjacentMonths() {
  const result = [];
  for (const offset of [-1,1,2,-2]) {
    let m=calMonth+offset, y=calYear;
    while(m>12){m-=12;y++;} while(m<1){m+=12;y--;}
    const key=y+'-'+m;
    if (!calCache[key]) result.push({m,y,key});
  }
  return result;
}

function scheduleIdlePrefetch() {
  const toFetch = adjacentMonths();
  if (!toFetch.length) return;
  const fetchOne = (index) => {
    if (index>=toFetch.length) return;
    const {m,y,key} = toFetch[index];
    const task = async () => {
      if (calCache[key]) { fetchOne(index+1); return; }
      try { calCache[key] = await apiFetch({mode:'calendar',month:m,year:y}); } catch(_) {}
      setTimeout(() => {
        if ('requestIdleCallback' in window) requestIdleCallback(()=>fetchOne(index+1),{timeout:10000});
        else setTimeout(()=>fetchOne(index+1),2000);
      }, 500);
    };
    if ('requestIdleCallback' in window) requestIdleCallback(task,{timeout:10000});
    else setTimeout(task,2000);
  };
  fetchOne(0);
}

function renderCalendar() {
  const area   = document.getElementById('contentArea');
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const now    = new Date();
  const byDay  = {};
  calData.forEach(item => {
    const key = new Date(item.DeliveryDate).getDate();
    if (!byDay[key]) byDay[key] = [];
    byDay[key].push(item);
  });
  const firstDay    = new Date(calYear,calMonth-1,1).getDay();
  const offset      = firstDay===0?6:firstDay-1;
  const daysInMonth = new Date(calYear,calMonth,0).getDate();
  const prevDays    = new Date(calYear,calMonth-1,0).getDate();
  let cells = '';
  for (let i=offset-1;i>=0;i--) cells+=`<div class="cal-day other-month"><div class="cal-day-num">${prevDays-i}</div></div>`;
  for (let d=1;d<=daysInMonth;d++) {
    const isToday = now.getDate()===d&&now.getMonth()+1===calMonth&&now.getFullYear()===calYear;
    const items   = byDay[d]||[];
    const shipped   = items.filter(i=>i.ShippedStatus&&i.ShippedStatus.toLowerCase().includes('shipped')).length;
    const unshipped = items.filter(i=>!i.ShippedStatus||!i.ShippedStatus.toLowerCase().includes('shipped')).length;
    const isPast    = new Date(calYear,calMonth-1,d)<new Date(now.getFullYear(),now.getMonth(),now.getDate());
    let dots = '';
    for (let s=0;s<Math.min(shipped,8);s++)   dots+=`<div class="cal-dot shipped"></div>`;
    for (let u=0;u<Math.min(unshipped,8);u++) dots+=`<div class="cal-dot ${isPast&&unshipped?'overdue':'unshipped'}"></div>`;
    cells+=`<div class="cal-day${isToday?' today':''}${items.length?' has-items':''}"
      ${items.length?`onclick="showDayItems(${d})"`:''}>
      <div class="cal-day-num">${d}</div>
      <div class="cal-dots">${dots}</div>
      ${items.length>4?`<div class="cal-count">${items.length}</div>`:''}
    </div>`;
  }
  const total=offset+daysInMonth, remaining=total%7===0?0:7-(total%7);
  for (let d=1;d<=remaining;d++) cells+=`<div class="cal-day other-month"><div class="cal-day-num">${d}</div></div>`;
  area.innerHTML = `
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calNav(-1)">◀</button>
      <div class="cal-month-title">${months[calMonth-1]} ${calYear}</div>
      <button class="cal-nav-btn" onclick="calNav(1)">▶</button>
      <button class="cal-nav-btn" onclick="calToday()" style="width:auto;padding:0 10px;font-size:0.72rem;font-family:var(--mono)">Today</button>
      <button class="cal-nav-btn" id="calViewToggle" onclick="toggleCalView()" style="width:auto;padding:0 10px;font-size:0.72rem;font-family:var(--mono)">📆 Week view</button>
      ${legendHtml()}
    </div>
    <div class="cal-grid">
      <div class="cal-day-header">Mon</div><div class="cal-day-header">Tue</div>
      <div class="cal-day-header">Wed</div><div class="cal-day-header">Thu</div>
      <div class="cal-day-header">Fri</div><div class="cal-day-header">Sat</div>
      <div class="cal-day-header">Sun</div>
      ${cells}
    </div>`;
}

function toggleCalView() {
  calView = calView==='week'?'month':'week';
  if (calView==='week') renderWeekView(); else renderCalendar();
}

function renderWeekView() {
  const area  = document.getElementById('contentArea');
  const now   = new Date();
  const ws    = new Date(calYear,calMonth-1,calWeekStart);
  const fixed = getWeekStart(ws);
  const days  = Array.from({length:7},(_,i)=>{ const d=new Date(fixed); d.setDate(fixed.getDate()+i); return d; });
  const weekLabel = days[0].toLocaleDateString('en-GB',{day:'numeric',month:'short'})+
    ' – '+days[6].toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

  // Collect data across any month boundaries
  const byDate = {};
  const addItems = (items) => {
    items.forEach(item => {
      const d   = new Date(item.DeliveryDate);
      const key = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
      if (!byDate[key]) byDate[key] = [];
      if (!byDate[key].find(x=>x.ItemID===item.ItemID)) byDate[key].push(item);
    });
  };
  addItems(calData);

  const buildCols = () => {
    const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    return days.map((d,idx) => {
      const key     = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
      const items   = byDate[key]||[];
      const isToday = d.toDateString()===now.toDateString();
      const isPast  = d<new Date(now.getFullYear(),now.getMonth(),now.getDate());
      const itemRows = items.map(i => {
        const shipped = i.ShippedStatus&&i.ShippedStatus.toLowerCase().includes('shipped');
        const color   = shipped?'var(--green)':isPast?'var(--red)':'var(--amber)';
        return `<div class="week-item" onclick="closeDayModal();showDetail(${i.ItemID})" style="border-left:3px solid ${color}">
          <div class="week-item-desc">${i.Description||'—'}</div>
          <div class="week-item-sub">${i.DocNo||''} · ${i.SoldToCompany||''}</div>
          ${i.SerialNumber?`<div class="week-item-serial">S/N: ${i.SerialNumber}</div>`:''}
          <div style="margin-top:4px">${shippedPill(i.ShippedStatus)}</div>
        </div>`;
      }).join('')||`<div class="week-empty">No deliveries</div>`;
      return `<div class="week-col${isToday?' week-today':''}">
        <div class="week-day-header">
          <div class="week-day-name">${dayNames[idx]}</div>
          <div class="week-day-num${isToday?' week-today-num':''}">${d.getDate()}</div>
          ${items.length?`<div class="week-day-count">${items.length}</div>`:''}
        </div>
        <div class="week-day-body">${itemRows}</div>
      </div>`;
    }).join('');
  };

  // Load extra months for boundary weeks then render
  const extraMonths = [];
  days.forEach(d => {
    const m=d.getMonth()+1, y=d.getFullYear();
    if ((m!==calMonth||y!==calYear)&&!extraMonths.find(e=>e.m===m&&e.y===y)) extraMonths.push({m,y});
  });

  const renderFinal = () => {
    area.innerHTML = `
      <div class="cal-nav" style="margin-bottom:12px">
        <button class="cal-nav-btn" onclick="calNav(-1)">◀</button>
        <div class="cal-month-title">${weekLabel}</div>
        <button class="cal-nav-btn" onclick="calNav(1)">▶</button>
        <button class="cal-nav-btn" onclick="calToday()" style="width:auto;padding:0 10px;font-size:0.72rem;font-family:var(--mono)">Today</button>
        <button class="cal-nav-btn" onclick="toggleCalView()" style="width:auto;padding:0 10px;font-size:0.72rem;font-family:var(--mono)">📅 Month view</button>
        ${legendHtml()}
      </div>
      <div class="week-grid">${buildCols()}</div>`;
  };

  if (!extraMonths.length) { renderFinal(); return; }
  Promise.all(extraMonths.map(async ({m,y}) => {
    const key=y+'-'+m;
    if (!calCache[key]) calCache[key] = await apiFetch({mode:'calendar',month:m,year:y});
    addItems(calCache[key]);
  })).then(renderFinal).catch(renderFinal);
}

function legendHtml() {
  return `<div style="display:flex;gap:16px;align-items:center;font-size:0.72rem;color:var(--dim);margin-left:auto">
    <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:var(--green);display:inline-block"></span>Shipped</span>
    <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:var(--amber);display:inline-block"></span>Pending</span>
    <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:var(--red);display:inline-block"></span>Overdue</span>
  </div>`;
}

function calNav(dir) {
  if (calView==='week') {
    const d=new Date(calYear,calMonth-1,calWeekStart);
    d.setDate(d.getDate()+dir*7);
    calYear=d.getFullYear(); calMonth=d.getMonth()+1; calWeekStart=getWeekStart(d).getDate();
    loadCalendar();
  } else {
    calMonth+=dir;
    if(calMonth>12){calMonth=1;calYear++;} if(calMonth<1){calMonth=12;calYear--;}
    loadCalendar();
  }
}

function calToday() {
  const n=new Date(); calMonth=n.getMonth()+1; calYear=n.getFullYear();
  calWeekStart=getWeekStart(n).getDate(); loadCalendar();
}

function showDayItems(day) {
  const items = calData.filter(i=>new Date(i.DeliveryDate).getDate()===day);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('dayModalTitle').textContent =
    `${day} ${months[calMonth-1]} ${calYear} — ${items.length} item${items.length!==1?'s':''}`;
  document.getElementById('dayModalBody').innerHTML = items.map(i=>`
    <div class="day-item-row" onclick="closeDayModal();showDetail(${i.ItemID})">
      <div>
        <div class="di-desc">${i.Description||'—'}</div>
        <div class="di-sub">${i.DocNo} · ${i.SoldToCompany||'—'} · ${i.SalesRep||'—'}</div>
        ${i.SerialNumber?`<div class="di-serial">S/N: ${i.SerialNumber}</div>`:''}
      </div>
      <div>${shippedPill(i.ShippedStatus)}</div>
    </div>`).join('');
  document.getElementById('dayModalOverlay').classList.add('open');
}

function closeDayModal(e) {
  if (!e||e.target===document.getElementById('dayModalOverlay'))
    document.getElementById('dayModalOverlay').classList.remove('open');
}

// ── Item table ────────────────────────────────────────────────────────────────
function renderItemTable(data, title) {
  const area = document.getElementById('contentArea');
  const PAGE = 1000;
  const visible = data.slice(0, PAGE);
  if (!data.length) {
    area.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No items found</div></div>`;
    return;
  }
  const buildRows = (rows) => rows.map(i => {
    const days = i.DeliveryDays;
    return `<tr onclick="showDetail(${i.ItemID})">
      <td class="td-docno">${i.DocNo||'—'}</td>
      <td class="td-desc">${i.Description||'—'}</td>
      <td class="td-company">${i.SoldToCompany||'—'}</td>
      <td class="td-serial">${i.SerialNumber||'—'}</td>
      <td>${shippedPill(i.ShippedStatus)}</td>
      <td class="td-date">${fmtShort(i.DeliveryDate)}</td>
      <td class="td-days ${daysClass(days)}">${daysLabel(days)}</td>
      <td style="font-family:var(--mono);font-size:0.72rem;color:var(--dim)">${i.SalesRep||'—'}</td>
    </tr>`;
  }).join('');

  area.innerHTML = `
    <div class="section-header">
      <div class="section-title">${title}</div>
      <div class="section-count">${data.length} items</div>
    </div>
    <table class="item-table">
      <thead><tr>
        <th>Doc No</th><th>Description</th><th>Company</th>
        <th>Serial No</th><th>Status</th><th>Delivery</th><th>Days</th><th>Rep</th>
      </tr></thead>
      <tbody id="itemTbody">${buildRows(visible)}</tbody>
    </table>
    ${data.length>PAGE?`<div class="load-more-wrap"><button class="load-more-btn" onclick="loadMoreItems()">Load more (${data.length-PAGE} remaining)</button></div>`:''}`;

  // Store full data for load more
  area._allData = data;
  area._page    = 1;
  area._buildRows = buildRows;
}

function loadMoreItems() {
  const area  = document.getElementById('contentArea');
  const PAGE  = 1000;
  area._page++;
  const chunk = area._allData.slice(0, area._page * PAGE);
  const tbody = document.getElementById('itemTbody');
  if (tbody) tbody.innerHTML = area._buildRows(chunk);
  if (chunk.length >= area._allData.length) {
    const btn = document.querySelector('.load-more-btn');
    if (btn) btn.parentElement.remove();
  } else {
    const btn = document.querySelector('.load-more-btn');
    if (btn) btn.textContent = `Load more (${area._allData.length - chunk.length} remaining)`;
  }
}

// ── Search ────────────────────────────────────────────────────────────────────
function handleSearch(type, val) {
  const clearIds = {serial:'clearSerial',company:'clearCompany',docno:'clearDocNo'};
  const el = document.getElementById(clearIds[type]);
  if (el) el.classList.toggle('visible', val.length>0);
  clearTimeout(searchTimeout);
  if (val.trim().length<2) return;
  searchTimeout = setTimeout(()=>runSearch(type,val.trim()),400);
}

function clearSearchBox(type) {
  const inputIds = {serial:'searchSerial',company:'searchCompany',docno:'searchDocNo'};
  const clearIds = {serial:'clearSerial', company:'clearCompany', docno:'clearDocNo'};
  const input=document.getElementById(inputIds[type]), clear=document.getElementById(clearIds[type]);
  if (input) input.value='';
  if (clear) clear.classList.remove('visible');
  if (currentTab==='search') switchTab(document.querySelector('[data-tab="calendar"]'),'calendar');
}

async function runSearch(type, q) {
  currentTab='search';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('pageTitle').textContent='Search Results';
  const area=document.getElementById('contentArea');
  area.innerHTML='<div class="loader"><div class="spinner"></div></div>';
  try {
    const data = await apiFetch({mode:'search',q,searchType:type});
    if (!data.length) {
      area.innerHTML=`<div class="search-bar-notice">No results for: "${q}"</div>
        <div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Try a different search term</div></div>`;
      return;
    }
    const rows=data.map(i=>`
      <tr onclick="showDetail(${i.ItemID})">
        <td class="td-docno">${i.DocNo||'—'}<div style="font-size:0.65rem;color:var(--muted);margin-top:2px">${i.DocType||''} · ${i.DocStatus||''}</div></td>
        <td class="td-desc">${i.Description||'—'}</td>
        <td class="td-company">${i.SoldToCompany||'—'}<div style="font-size:0.68rem;color:var(--muted);margin-top:1px">${i.SoldToContact||''}</div></td>
        <td class="td-serial">${i.SerialNumber||'—'}</td>
        <td style="font-family:var(--mono);font-size:0.72rem;color:var(--muted)">${i.ManufacturerPartNumber||'—'}</td>
        <td>${shippedPill(i.ShippedStatus)}</td>
        <td class="td-date">${fmtShort(i.DeliveryDate)}</td>
        <td style="font-family:var(--mono);font-size:0.72rem;color:var(--dim)">${i.SalesRep||'—'}</td>
      </tr>`).join('');
    area.innerHTML=`
      <div class="search-bar-notice">${data.length} result${data.length!==1?'s':''} for: "<strong>${q}</strong>"</div>
      <table class="item-table">
        <thead><tr>
          <th>Doc No</th><th>Description</th><th>Company / Contact</th>
          <th>Serial No</th><th>Part No</th><th>Shipped</th><th>Delivery</th><th>Rep</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  } catch(e) {
    area.innerHTML=`<div class="empty"><div class="empty-icon">⚠</div><div class="empty-text">Search error: ${e.message}</div></div>`;
  }
}

function clearAllSearches() {
  ['searchSerial','searchCompany','searchDocNo'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  ['clearSerial','clearCompany','clearDocNo'].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('visible');});
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key==='Escape') { closePanel(); closeDayModal(); }
  if ((e.metaKey||e.ctrlKey)&&e.key==='k') { e.preventDefault(); document.getElementById('searchSerial').focus(); }
});

loadStats();
loadTab('calendar');
